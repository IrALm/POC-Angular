<div class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 w-full max-w-sm pointer-events-none">
  @for (t of toast.toasts(); track t.id) {
    <div class="flex items-start gap-3 px-4 py-3 rounded-xl border shadow-lg text-sm font-medium pointer-events-auto animate-in slide-in-from-right-4 fade-in duration-200"
         [class]="classFor(t.type)">
      <span class="text-base shrink-0 mt-0.5" [class]="iconClassFor(t.type)">{{ iconFor(t.type) }}</span>
      <span class="flex-1 leading-relaxed">{{ t.message }}</span>
      <button (click)="toast.remove(t.id)"
              class="shrink-0 opacity-60 hover:opacity-100 transition-opacity text-base leading-none mt-0.5">
        ✕
      </button>
    </div>
  }
</div>
